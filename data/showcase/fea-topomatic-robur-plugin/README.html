<h1>fea-topomatic-robur-plugin</h1>
<p>A plugin for Topomatic Robur that converts BREP models into FEA meshes, exports them to popular FEA solvers and includes a built-in analyzer.</p>
<h2>Features</h2>
<ul>
<li>Converts BREP models to FEA meshes</li>
<li>Exports to popular FEA solvers</li>
<li>Built-in analyzer</li>
</ul>
