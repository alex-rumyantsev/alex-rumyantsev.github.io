name: sync projects

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.PORTFOLIO_SYNC_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch repositories
        run: |
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --output repos.json \
            "https://api.github.com/user/repos?per_page=100"

      - name: Fetch showcase files
        run: |
          rm -rf data/previews data/showcase
          mkdir -p data/showcase
          jq -r '.[] | select(.topics | index("portfolio")) | .full_name' repos.json |
          while read -r full_name; do
            name="${full_name#*/}"
            work=$(mktemp -d)
            status=$(curl --silent --location \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              --output "$work/repo.tar.gz" \
              --write-out '%{http_code}' \
              "https://api.github.com/repos/${full_name}/tarball")
            if [ "$status" = "200" ]; then
              tar -xzf "$work/repo.tar.gz" -C "$work"
              for source in "$work"/*/showcase; do
                [ -d "$source" ] || continue
                mkdir -p "data/showcase/$name"
                cp -r "$source/." "data/showcase/$name/"
              done
              if [ -f "data/showcase/$name/README.md" ]; then
                jq -Rs '{text: ., mode: "gfm"}' "data/showcase/$name/README.md" |
                  curl --silent --show-error --fail \
                    --header "Authorization: Bearer $GH_TOKEN" \
                    --header "Accept: text/html" \
                    --header "Content-Type: application/json" \
                    --data @- \
                    --output "data/showcase/$name/README.html" \
                    "https://api.github.com/markdown"
              fi
            fi
            rm -rf "$work"
          done

      - name: Build projects data
        run: |
          for directory in data/showcase/*/; do
            [ -f "${directory}preview.svg" ] && basename "$directory"
          done | jq -R . | jq -s . > previews.json
          for directory in data/showcase/*/; do
            [ -d "$directory" ] || continue
            jq -n --arg name "$(basename "$directory")" \
              --arg readme "$([ -f "${directory}README.html" ] && echo true || echo false)" \
              --argjson downloads "$(ls -1 "${directory}downloads" 2>/dev/null | jq -R . | jq -s .)" \
              '{($name): {readme: ($readme == "true"), downloads: $downloads}}'
          done | jq -s 'add // {}' > showcase.json
          jq --slurpfile previews previews.json --slurpfile showcase showcase.json '[ .[]
            | select(.topics | index("portfolio"))
            | .name as $name
            | {
                name,
                description,
                language,
                pushed_at,
                stars: .stargazers_count,
                url: (
                  if (.homepage // "") != ""
                  then .homepage
                  else "project.html?name=" + .name
                  end
                ),
                repository: (if .private then null else .html_url end),
                preview: (
                  if ($previews[0] | index($name)) != null
                  then "data/showcase/" + $name + "/preview.svg"
                  else null
                  end
                ),
                readme: ($showcase[0][$name].readme // false),
                downloads: ($showcase[0][$name].downloads // [])
              } ]' repos.json > data/projects.json
      
      - name: Fetch language colors
        run: |
          curl --fail --silent --show-error --location \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github.raw+json" \
            --output languages.yml \
            "https://api.github.com/repos/github-linguist/linguist/contents/lib/linguist/languages.yml"
          yq -o=json '.' languages.yml |
            jq 'with_entries(select(.value.color != null) | .value = .value.color)' > data/language-colors.json

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --staged --quiet || git commit -m "chore: update projects data"
          git push