<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Alexander Rumyantsev</title>
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <header>
      <!-- Top bar -->
    </header>

    <main>
      <div class="hero">
        <video
          class="hero__video"
          src="assets/hero-background.mp4"
          autoplay
          muted
          loop
          playsinline
          aria-hidden="true"
        ></video>

        <section id="intro" class="intro">
          <img
            class="intro__photo"
            src="assets/profile.png"
            alt="Portrait of Alexander Rumyantsev"
            width="1024"
            height="1172"
          />
          <div class="intro__text">
            <h1>
              <span>Alexander</span>
              <span>Rumyantsev</span>
            </h1>
            <p>
              Software Engineer focused on building robust, efficient, and scalable software solutions.<br> 
              I turn complex technical challenges into clean, reliable, and maintainable code.
            </p>
          </div>
        </section>
      </div>

      <section id="projects" class="projects">
        <h2>Projects</h2>

        <div class="projects__grid">
          <!-- Project card: copy this whole block to add a project -->
          <article class="project-card">
            <h3>Project name</h3>
            <p>Short description of the project.</p>
            <ul class="project-card__tags">
              <li>Technology</li>
            </ul>
            <a
              class="project-card__link"
              href="https://github.com/alex-rumyantsev/repository-name"
              target="_blank"
              rel="noopener noreferrer"
            >
              View on GitHub
            </a>
          </article>

        </div>
      </section>
    </main>

    <footer>
      <!-- Footer -->
    </footer>
  </body>
</html>
